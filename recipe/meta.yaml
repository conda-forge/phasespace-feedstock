{% set name = "phasespace" %}
{% set version = "1.11.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/zfit/phasespace/archive/{{ version }}.tar.gz
  sha256: 3da157338ad1827ec8af87d7c855a8e711d5feccdcddc1cd17967f154b58352c

build:
  number: 0
  script: '{{ PYTHON }} -m pip install . -vv '
  noarch: python

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools_scm
    - setuptools_scm_git_archive
    - setuptools
  run:
    - python >={{ python_min }}
    - tensorflow >=2.15
    - tensorflow-probability >=0.23
    - particle
    - decaylanguage
    - vector

test:
  requires:
    - python {{ python_min }}
  imports:
    - phasespace
    - phasespace.kinematics
    - phasespace.phasespace
    - phasespace.random

about:
  home: https://github.com/zfit/phasespace
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Phase space generation implemented in TensorFlow
  doc_url: https://phasespace.readthedocs.io
  dev_url: https://github.com/zfit/phasespace

extra:
  recipe-maintainers:
    - chrisburr
    - jonas-eschle
